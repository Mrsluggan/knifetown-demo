<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Knifetown Burgers – förslag på ny hemsida</title>
<link rel="icon" href="img/favicon.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111 url("img/bakgrund.jpg") center/cover;color:#f1f1f1;font:17px/1.5 system-ui,sans-serif;padding:24px}
  main{max-width:640px;width:100%;text-align:center}
  img{width:120px;margin:0 auto 10px;display:block}
  h1{font-size:28px;margin:0 0 6px}
  p{color:#aaa;margin:0 0 28px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left}
  a{display:block;padding:22px;border-radius:10px;text-decoration:none;color:inherit;border:1px solid #3a3a3a;background:rgba(20,20,20,.9)}
  a:hover{border-color:#fff}
  a.modern{background:#fff;color:#0d0d0d;border-color:#fff}
  b{display:block;font-size:20px;margin-bottom:4px}
  small{opacity:.8}
  @media (max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <img src="img/logo.png" alt="Knifetown Burgers">
  <h1>Förslag på ny hemsida</h1>
  <p>Två versioner med samma innehåll. Testa gärna i mobilen.</p>
  <div class="grid">
    <a href="klassisk/"><b>Klassisk</b><small>Lik er nuvarande, men renare</small></a>
    <a class="modern" href="modern/"><b>Modern</b><small>Affischstil som sticker ut</small></a>
  </div>
</main>
</body>
</html>
